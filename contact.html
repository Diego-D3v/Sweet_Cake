<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Sweet Cake - Contact
    </title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/icono_pague.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Imperial+Script&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>
    <div class="menu">
        <img src="img/logo.png" alt="logo" class="logo">
        <div class="menu_links">
            <button class="item_menu" onclick="location.href='index.html'">
                Home
            </button>
            <button class="item_menu" onclick="location.href='about.html'">
                About
            </button>
            <button class="item_menu" onclick="location.href='product.html'">
                Products
            </button>
            <button class="item_menu" onclick="location.href='contact.html'">
                Contact
            </button>
        </div>
        <div class="icono_compras">
            add_shopping_cart
        </div>
    </div>
    <section class="contact">
        <div class="contact_title">
            Contact Us
        </div>
        <div class="contact_subtitle">
            We'd Love to Hear From You
        </div>
        <div class="contact_container">
            <div class="contact_info">
                <div class="contact_item">
                    📍 Sweet Cake Store
                    <br>
                    Bogotá, Colombia
                </div>
                <div class="contact_item">
                    📞 +57 300 000 0000
                </div>
                <div class="contact_item">
                    ✉ sweetcake@email.com
                </div>
                <div class="contact_item">
                    🕒 Open:
                    9AM - 9PM
                </div>
            </div>
            <form class="contact_form">
                <div class="input_group">
                    <input type="text" required>
                    <label>
                        Your Name
                    </label>
                </div>
                <div class="input_group">
                    <input type="email" required>
                    <label>
                        Email
                    </label>
                </div>
                <div class="input_group">
                    <textarea required></textarea>
                    <label>
                        Message
                    </label>
                </div>
                <button>
                    Send Message
                </button>
            </form>
        </div>
    </section>
</body>

</html>
